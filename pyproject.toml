[project]
name = "qloo-relocation-scout"
version = "0.2.0"
description = "Relocation Scout: a Qloo-powered relocation agent"
requires-python = ">=3.12"
# Ranges, not pins: the Worker build resolves against Pyodide's wheel index, which can lag PyPI
# (e.g. pydantic-core). Docker/local use the exact pins in requirements-server.txt.
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["workers-py", "workers-runtime-sdk"]
