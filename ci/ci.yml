name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - name: Tests (offline, Qloo mocked)
        run: python -m pytest -q tests/test_app.py
        env: { ENV: production }
      - name: pip-audit
        run: pip-audit -r requirements.txt
      - name: bandit
        run: bandit -q -r agent.py app.py
      - name: gitleaks (full history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --redact --exit-code 1
