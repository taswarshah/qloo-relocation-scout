<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relocation Scout · Qloo-powered</title>
<link rel="stylesheet" href="/static/style.css"></head><body>
<h1>🧭 Relocation Scout</h1><p class="sub">Tell it what you love. It finds cities & neighborhoods that share your taste, using Qloo's cross-domain taste graph.</p>
<div class="presets">Try: <button type="button" data-preset="0">Indie creative</button><button type="button" data-preset="1">Foodie & nightlife</button><button type="button" data-preset="2">Outdoorsy family (US)</button></div>
<form id="f">
<label>Music (artists)</label><input name="music" maxlength="400" placeholder="Radiohead, Bon Iver">
<label>Films</label><input name="films" maxlength="400" placeholder="Amélie, Lost in Translation">
<label>TV shows</label><input name="tv" maxlength="400" placeholder="The Bear">
<label>Books</label><input name="books" maxlength="400" placeholder="Norwegian Wood">
<label>Favorite restaurants / cafés</label><input name="food" maxlength="400" placeholder="Blue Bottle Coffee">
<label>Brands</label><input name="brands" maxlength="400" placeholder="Patagonia">
<label>Lifestyle (keywords)</label><input name="lifestyle" maxlength="400" placeholder="walkable, art, nightlife, hiking">
<label>Limit to country (optional ISO code)</label><input name="country" placeholder="US, PT, DE…" maxlength="2" pattern="[A-Za-z]{2}">
<button type="submit">Scout cities</button></form>
<div id="out"></div>
<script src="/static/app.js"></script><p class="small">Powered by Qloo Taste AI™ (Insights API). Not affiliated with Qloo.</p></body></html>
